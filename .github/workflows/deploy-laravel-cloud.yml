name: Deploy Laravel Cloud

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest

    env:
      LARAVEL_CLOUD_DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}

    steps:
      - name: Resolve commit to deploy
        id: context
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "commit_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          else
            echo "commit_sha=${{ github.event.workflow_run.head_sha }}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Skip when deploy hook is missing
        if: env.LARAVEL_CLOUD_DEPLOY_HOOK == ''
        run: echo "Secret LARAVEL_CLOUD_DEPLOY_HOOK absent, deploiement ignore."

      - name: Trigger Laravel Cloud deployment
        if: env.LARAVEL_CLOUD_DEPLOY_HOOK != ''
        shell: bash
        run: |
          curl --fail-with-body --show-error --silent \
            -X POST \
            "${LARAVEL_CLOUD_DEPLOY_HOOK}?commit_hash=${{ steps.context.outputs.commit_sha }}"
