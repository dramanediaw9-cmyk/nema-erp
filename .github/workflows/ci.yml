name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, sqlite, pdo_sqlite, pdo_mysql, dom, fileinfo, json
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          mkdir -p database
          touch database/ci.sqlite
          php -r "file_exists('.env') || exit(1); \$env = file_get_contents('.env'); \$overrides = ['APP_URL' => 'http://127.0.0.1:8000', 'DB_CONNECTION' => 'sqlite', 'DB_DATABASE' => 'database/ci.sqlite', 'SESSION_DRIVER' => 'database', 'CACHE_STORE' => 'database', 'QUEUE_CONNECTION' => 'database']; foreach (\$overrides as \$key => \$value) { \$pattern = '/^'.preg_quote(\$key, '/').'=.*$/m'; \$line = \$key.'='.\$value; \$env = preg_match(\$pattern, \$env) ? preg_replace(\$pattern, \$line, \$env) : \$env.PHP_EOL.\$line; } file_put_contents('.env', \$env);"
          php artisan key:generate
          php artisan migrate --seed --force
          php artisan storage:link

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend assets
        run: npm run build

      - name: Run Pint On Hardened Core Surfaces
        run: >-
          vendor/bin/pint --test
          app/Modules/Core/Onboarding
          app/Modules/Core/Ops
          routes/console.php
          config/ops.php
          tests/Feature/OpsHealthTest.php
          tests/Feature/PilotReadinessTest.php
          tests/Feature/SectorDemoDataTest.php
          tests/Feature/SectorOnboardingStarterTest.php

      - name: Run PHPStan On Hardened Access Surfaces
        run: composer analyse --no-interaction

      - name: Run tests
        run: php artisan test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Laravel server
        run: php artisan serve --host=127.0.0.1 --port=8000 > storage/logs/ci-serve.log 2>&1 &

      - name: Wait for Laravel server
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/login >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat storage/logs/ci-serve.log
          exit 1

      - name: Run browser smoke tests
        run: npm run e2e:smoke

  test-mysql:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: nema_erp_ci
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo_mysql, dom, fileinfo, json
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare MySQL environment
        env:
          APP_URL: http://127.0.0.1:8000
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nema_erp_ci
          DB_USERNAME: root
          DB_PASSWORD: root
          SESSION_DRIVER: database
          CACHE_STORE: database
          QUEUE_CONNECTION: database
        run: |
          cp .env.example .env
          php -r "file_exists('.env') || exit(1); \$env = file_get_contents('.env'); \$overrides = ['APP_URL' => getenv('APP_URL'), 'DB_CONNECTION' => getenv('DB_CONNECTION'), 'DB_HOST' => getenv('DB_HOST'), 'DB_PORT' => getenv('DB_PORT'), 'DB_DATABASE' => getenv('DB_DATABASE'), 'DB_USERNAME' => getenv('DB_USERNAME'), 'DB_PASSWORD' => getenv('DB_PASSWORD'), 'SESSION_DRIVER' => getenv('SESSION_DRIVER'), 'CACHE_STORE' => getenv('CACHE_STORE'), 'QUEUE_CONNECTION' => getenv('QUEUE_CONNECTION')]; foreach (\$overrides as \$key => \$value) { \$pattern = '/^'.preg_quote(\$key, '/').'=.*$/m'; \$line = \$key.'='.\$value; \$env = preg_match(\$pattern, \$env) ? preg_replace(\$pattern, \$line, \$env) : \$env.PHP_EOL.\$line; } file_put_contents('.env', \$env);"
          php artisan key:generate
          php artisan migrate --seed --force

      - name: Run tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: nema_erp_ci
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test
